name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key (made once, then reused so updates install over the old app)
        run: |
          if [ ! -f app/debug.keystore.b64 ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            base64 app/debug.keystore > app/debug.keystore.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/debug.keystore.b64
            git commit -m "Add app signing key [skip ci]"
            git push
          else
            base64 -d app/debug.keystore.b64 > app/debug.keystore
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyIPTV-apk
          path: MyIPTV.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MyIPTV – latest build
          body: Download MyIPTV.apk below and open it on your phone to install or update.
          files: MyIPTV.apk
          make_latest: true
